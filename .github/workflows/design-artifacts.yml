name: Design Artifacts

# Publish two deliberately different catalogs, mirroring Confetti's module matrix:
#
# * thunderbird      — real Android inbox states from :feature:mail:message:list:internal
# * thunderbird-bolt — reusable primitives from the Compose Multiplatform :ui:bolt module
#
# Each system gets its own design-artifacts/<system> delivery branch for preview.coo.ee.

on:
  workflow_dispatch:
  push:
    branches:
      - previews
    paths:
      - 'catalog*.spec.json'
      - 'components/ui/bolt/src/**'
      - 'components/ui/bolt/build.gradle.kts'
      - 'feature/mail/message/list/api/src/**'
      - 'feature/mail/message/list/internal/src/**'
      - 'feature/mail/message/list/internal/build.gradle.kts'
      - 'components/gradlew'
      - 'build-plugin/build.gradle.kts'
      - 'build-plugin/src/main/kotlin/thunderbird.preview.renderer.gradle.kts'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/design-artifacts.yml'

permissions:
  contents: read

concurrency:
  group: design-artifacts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.repository == 'yschimke/thunderbird-android' }}
    name: ${{ matrix.system }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: thunderbird
            spec: catalog.spec.json
            module: ':feature:mail:message:list:internal'
            moduleDir: feature/mail/message/list/internal
            workingDirectory: '.'
            renderFilter: CatalogPreview
            desktop: false
            previewAnnotations: 'PreviewLightDark PreviewScreenSizes PreviewLightDarkLandscape'
          - system: thunderbird-bolt
            spec: catalog.bolt.spec.json
            module: ':ui:bolt'
            moduleDir: components/ui/bolt
            workingDirectory: components
            renderFilter: ''
            desktop: true
            previewAnnotations: 'PreviewDevices PreviewDevicesWithBackground PreviewLightDark PreviewLightDarkLandscape'
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - name: Check out previews branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Install compose-preview CLI
        uses: yschimke/compose-ai-tools/.github/actions/install@c5cd378757072b0d11a46b375f31b2788164d961 # v1.21.0
        with:
          version: catalog
          catalog-key: composeAiPreview
          catalog-path: gradle/libs.versions.toml
          github-token: ${{ github.token }}

      - name: Check out compose-ai-tools export driver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yschimke/compose-ai-tools
          # Same release the install step above resolves from the version catalog
          # (composeAiPreview), so the export driver and the renderer that produced
          # the PNGs it reads can't skew apart. This was `main`, which let a driver
          # newer than the pinned CLI run against that CLI's output. Bump this in
          # lockstep with `composeAiPreview` in gradle/libs.versions.toml.
          ref: v1.21.0
          path: compose-ai-tools
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install export engine
        working-directory: compose-ai-tools/scripts/design-artifacts
        env:
          DESIGN_PARITY_VERSION: 0.1.53
        run: |
          npm ci --no-audit --no-fund --loglevel=warn
          # Hold the export packages at the design-parity release this repo has
          # validated, without modifying the upstream checkout's lock.
          npm install --no-save --package-lock=false --no-audit --no-fund --loglevel=warn \
            "@design-parity/adapter-figma@$DESIGN_PARITY_VERSION" \
            "@design-parity/candidate@$DESIGN_PARITY_VERSION" \
            "@design-parity/catalog-export@$DESIGN_PARITY_VERSION"

      - name: Validate catalog spec
        id: validate-spec
        env:
          SPEC: ${{ matrix.spec }}
          MODULE_DIR: ${{ matrix.moduleDir }}
          PREVIEW_ANNOTATIONS: ${{ matrix.previewAnnotations }}
        run: |
          set -euo pipefail
          args=(
            --spec "$SPEC"
            --module-dir "$MODULE_DIR"
            --live-bundle
            --render-filter-out "$GITHUB_WORKSPACE/render-filter.txt"
          )
          for annotation in $PREVIEW_ANNOTATIONS; do
            args+=(--preview-annotation "$annotation")
          done
          node compose-ai-tools/scripts/design-artifacts/validate-catalog-spec.mjs "${args[@]}"
          echo "render-filter=$(cat "$GITHUB_WORKSPACE/render-filter.txt")" >> "$GITHUB_OUTPUT"

      - name: Install desktop render dependencies
        if: ${{ matrix.desktop }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            xvfb libgl1 libglx-mesa0 libgl1-mesa-dri libfreetype6 libfontconfig1 fontconfig

      # The product wrappers deliberately end in CatalogPreview. Filtering to them avoids the
      # @PreviewParameter filename ambiguity in compose-ai-tools#3049 while preserving the richer
      # multipreviews for Android Studio. Bolt uses the required-entry filter from its spec.
      # Semantics capture is temporarily omitted: it ignores entry filtering and traverses every
      # discovered id, which previously hit the hard 600-second deadline. The live bundle remains
      # complete and --allow-incomplete records the absent sidecars explicitly.
      - name: Render catalog bundle
        working-directory: ${{ matrix.workingDirectory }}
        env:
          STATIC_FILTER: ${{ matrix.renderFilter }}
          SPEC_FILTER: ${{ steps.validate-spec.outputs.render-filter }}
          IS_DESKTOP: ${{ matrix.desktop }}
          MODULE: ${{ matrix.module }}
        run: |
          set -euo pipefail
          filter="$STATIC_FILTER"
          if [[ -z "$filter" ]]; then
            filter="$SPEC_FILTER"
          fi
          theme_filter='Thunderbird Light theme,Thunderbird Dark theme,K-9 Mail Light theme,K-9 Mail Dark theme'
          if [[ -n "$filter" ]]; then
            filter="$filter,$theme_filter"
          else
            filter="$theme_filter"
          fi
          command=(
            compose-preview bundle pack
            --module "$MODULE"
            --progress
            -o "$GITHUB_WORKSPACE/bundle.png"
            --timeout 1800
          )
          if [[ "$IS_DESKTOP" == 'true' ]]; then
            env "ORG_GRADLE_PROJECT_composePreview.filter=$filter" \
              xvfb-run -a -s '-screen 0 2000x1400x24' "${command[@]}"
          else
            env "ORG_GRADLE_PROJECT_composePreview.filter=$filter" "${command[@]}"
          fi

      - name: Generate importable catalog
        env:
          MODULE: ${{ matrix.module }}
          SPEC: ${{ matrix.spec }}
        run: |
          node compose-ai-tools/scripts/design-artifacts/generate-design-catalog.mjs \
            --spec "$SPEC" \
            --renders "$GITHUB_WORKSPACE/bundle.png" \
            --out "$GITHUB_WORKSPACE/out" \
            --renderer "$(compose-preview --version | head -1)" \
            --source-repo "$GITHUB_REPOSITORY" \
            --source-ref previews \
            --source-module "$MODULE" \
            --publish-live-bundle \
            --allow-incomplete

      # Split with a SHARED classpath rather than a self-contained bundle per preview:
      # `classes/app.jar` is published once under `bundle/res/<sha256>` and each split
      # manifest carries a hash-verified `externalClasspath` pointing at it. The live
      # re-render lane is unchanged (a trusted serve host hydrates the pooled jar before
      # starting the daemon); what goes away is the carriage repeating once per preview,
      # which grows the delivery branch on every publish because any catalog edit rewrites
      # app.jar. See yschimke/compose-ai-tools#4211.
      - name: Split into per-preview bundles
        run: |
          compose-preview bundle split "$GITHUB_WORKSPACE/out/bundle/bundle.png" \
            --shared-classpath-out "$GITHUB_WORKSPACE/out/bundle/res" \
            -o "$GITHUB_WORKSPACE/out/bundle/previews"

      - name: Publish design-artifacts/${{ matrix.system }}
        env:
          GH_TOKEN: ${{ github.token }}
          SYSTEM: ${{ matrix.system }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/out"
          git init -q
          git checkout -q -b "design-artifacts/$SYSTEM"
          git config user.name 'Yuri Schimke'
          git config user.email 'yuri@schimke.ee'
          git add -A
          git commit -q -m "chore(design-artifacts): regenerate $SYSTEM catalog ($(date -u +%F))"
          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/design-artifacts/$SYSTEM"
